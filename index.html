<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Dimas MovieX - LK21 Stream</title>
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: white; }
        header { background: #1a1a1a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00b4d8; }
        header h1 { margin: 0; font-size: 24px; color: #00b4d8; cursor: pointer; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { padding: 8px 15px; border-radius: 20px; border: 1px solid #333; background: #222; color: white; width: 250px; outline: none; }
        .search-box button { background: #00b4d8; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { margin-bottom: 20px; font-size: 20px; border-left: 4px solid #00b4d8; padding-left: 10px; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .movie-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative;}
        .movie-card:hover { transform: scale(1.05); border: 1px solid #00b4d8;}
        .movie-card img { width: 100%; height: 260px; object-fit: cover; background: #222; }
        .badge-star { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #ffd700; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .movie-info { padding: 10px; }
        .movie-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .movie-meta { font-size: 11px; color: #aaa; }
        
        #player-section { display: none; background: #111; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        #video-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .server-box { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; margin: 5px; }
        .ep-btn:hover, .ep-btn.active { background: #00b4d8; border-color: #00b4d8; }
        
        #loading { text-align: center; color: #00b4d8; font-weight: bold; margin: 20px; display: none; }
        .desc-text { font-size: 13px; color: #ccc; line-height: 1.6; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="loadHome()">🎥 Dimas MovieX</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari film atau series..." onkeypress="if(event.key==='Enter') searchMovie()">
            <button onclick="searchMovie()">CARI</button>
        </div>
    </header>

    <div class="container">
        <div id="loading">Memuat data film... ⏳</div>
        
        <div id="player-section">
            <h2 id="play-title" style="margin-top: 0; color:#00b4d8;">Judul Film</h2>
            <div class="desc-text" id="play-desc"></div>
            
            <div id="video-wrapper"></div>
            <div id="server-list-container"></div>
        </div>

        <h2 class="section-title" id="grid-title">Rekomendasi Terbaru</h2>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <script>
        async function fetchAPI(url) {
            document.getElementById('loading').style.display = 'block';
            try {
                let res = await fetch(url);
                let json = await res.json();
                document.getElementById('loading').style.display = 'none';
                return json.data;
            } catch (err) {
                console.error(err);
                document.getElementById('loading').style.display = 'none';
                return null;
            }
        }

        async function loadHome() {
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('grid-title').innerText = "Rekomendasi Terbaru";
            document.getElementById('video-wrapper').innerHTML = '';
            
            const data = await fetchAPI('/api?action=home');
            if (data) renderGrid(data);
        }

        async function searchMovie() {
            const keyword = document.getElementById('searchInput').value;
            if(!keyword) return;
            
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('video-wrapper').innerHTML = '';
            document.getElementById('grid-title').innerText = `Hasil Pencarian: "${keyword}"`;
            
            const data = await fetchAPI(`/api?action=search&query=${encodeURIComponent(keyword)}`);
            if (data && data.length > 0) {
                renderGrid(data);
            } else {
                document.getElementById('movieGrid').innerHTML = '<div style="color:#aaa;">Film tidak ditemukan.</div>';
            }
        }

        function renderGrid(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            movies.forEach(m => {
                let card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => loadDetail(m.url);
                
                card.innerHTML = `
                    <div class="badge-star">⭐ ${m.star || 'N/A'}</div>
                    <img src="${m.thumbnail}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                    <div class="movie-info">
                        <div class="movie-title" title="${m.judul}">${m.judul}</div>
                        <div class="movie-meta">${m.kategori || 'Movie'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function loadDetail(url) {
            document.getElementById('player-section').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            document.getElementById('play-title').innerText = "Memuat Detail...";
            document.getElementById('play-desc').innerText = "";
            document.getElementById('video-wrapper').innerHTML = '<div style="color:#aaa;">Menyiapkan server...</div>';
            document.getElementById('server-list-container').innerHTML = '';

            const data = await fetchAPI(`/api?action=detail&url=${encodeURIComponent(url)}`);

            if (data) {
                document.getElementById('play-title').innerText = data.judul;
                document.getElementById('play-desc').innerText = data.deskripsi || "Tidak ada sinopsis.";

                if (data.url_stream && data.url_stream.length > 0) {
                    let serversHTML = '<div class="server-box">';
                    serversHTML += '<div class="server-title">PILIH SERVER STREAMING:</div>';
                    serversHTML += '<div style="display:flex; flex-wrap:wrap;">';
                    
                    data.url_stream.forEach((s, idx) => {
                        serversHTML += `<button class="ep-btn" onclick="switchServer('${s.url}', this)">${s.server}</button>`;
                    });
                    serversHTML += '</div></div>';
                    document.getElementById('server-list-container').innerHTML = serversHTML;

                    setTimeout(() => {
                        let btns = document.querySelectorAll('#server-list-container .ep-btn');
                        if(btns.length > 0) btns[0].classList.add('active');
                    }, 50);

                    switchServer(data.url_stream[0].url, null);
                } else {
                    document.getElementById('video-wrapper').innerHTML = '<div style="color:red;">Server streaming tidak ditemukan!</div>';
                }
            }
        }

        // === MENGGUNAKAN PROXY ZYNFX UNTUK PEMUTARAN ===
        window.switchServer = function(link, btnElement) {
            if(btnElement) {
                document.querySelectorAll('#server-list-container .ep-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            
            const videoContainer = document.getElementById('video-wrapper');
            
            // Melewatkan link video asli melalui proxy Zynfx
            const proxiedLink = `/api/proxy?url=${encodeURIComponent(link)}`;
            
            videoContainer.innerHTML = `<iframe src="${proxiedLink}" allowfullscreen allow="autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>`;
        };

        loadHome();
    </script>
</body>
</html>
